<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI Image Studio</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
<div class="container">
  <h1>AI Image Studio</h1>
  <p class="sub">Upscale & Hapus Background (100% Browser)</p>

  <div class="card">
    <input type="file" id="uploadInput" accept="image/*" />
    <div id="status">Silakan pilih gambar terlebih dahulu.</div>
  </div>

  <div class="tabs">
    <button type="button" class="tab-btn active" id="btnTabUpscale">1. AI Upscaler</button>
    <button type="button" class="tab-btn" id="btnTabBg">2. Hapus BG</button>
  </div>

  <div id="tab-upscale" class="card controls">
    <label>Pilih Model Upscaler:</label>
    <select id="upscaleModel">
      <option value="Xenova/swin2SR-classical-sr-x2-64">Swin2SR 2x (Cepat & Natural untuk Adobe Stock)</option>
      <option value="Xenova/swin2SR-realworld-sr-x4-64-bsrgan-psnr">Swin2SR 4x RealWorld (Detail Tajam)</option>
    </select>
    <button type="button" class="action" id="btnUpscale">Proses Upscale</button>
  </div>

  <div id="tab-removebg" class="card controls hidden">
    <p class="sub">Hapus latar belakang otomatis menggunakan model RMBG-1.4 (BRIA AI).</p>
    <button type="button" class="action" id="btnRemoveBg">Hapus Background</button>
  </div>

  <div class="card">
    <div class="canvas-wrap"><canvas id="mainCanvas"></canvas></div>
    <div class="row" style="margin-top:12px;">
      <button type="button" class="action green" id="btnDownload">Download PNG</button>
      <button type="button" class="action gray" id="btnApply">Terapkan ke Utama</button>
    </div>
  </div>
</div>
<script src="app.js"></script>
</body>
</html>
